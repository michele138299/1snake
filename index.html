<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake Game</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #101827; color: #f8fafc; font-family: Arial, sans-serif;
      padding: 20px;
    }
    main { width: min(100%, 460px); text-align: center; }
    h1 { color: #4ade80; margin-bottom: 8px; }
    .score { font-size: 1.2rem; margin: 12px; }
    canvas {
      display: block; width: 100%; height: auto; aspect-ratio: 1;
      background: #1e293b; border: 3px solid #4ade80; border-radius: 10px;
      touch-action: none;
    }
    button {
      border: 0; border-radius: 9px; padding: 12px 18px; margin: 8px 4px;
      background: #4ade80; color: #102018; font-size: 1rem;
      font-weight: bold; cursor: pointer;
    }
    button:hover { background: #86efac; }
    #message { min-height: 24px; color: #cbd5e1; }
    .controls { display: grid; grid-template-columns: repeat(3, 58px); gap: 5px; justify-content: center; margin-top: 8px; }
    .controls button { margin: 0; padding: 12px 0; font-size: 1.2rem; }
    .empty { visibility: hidden; }
    .hint { color: #94a3b8; font-size: .9rem; }
  </style>
</head>
<body>
  <main>
    <h1>🐍 Snake Game</h1>
    <div class="score">Score: <strong id="score">0</strong></div>
    <canvas id="game" width="400" height="400" aria-label="Snake speelveld"></canvas>
    <p id="message">Druk op Start om te spelen!</p>
    <button id="start">Start / Opnieuw</button>
    <div class="controls" aria-label="Aanraakbediening">
      <span class="empty"></span><button data-dir="up" aria-label="Omhoog">▲</button><span class="empty"></span>
      <button data-dir="left" aria-label="Links">◀</button>
      <button data-dir="down" aria-label="Omlaag">▼</button>
      <button data-dir="right" aria-label="Rechts">▶</button>
    </div>
    <p class="hint">Gebruik de pijltjestoetsen of WASD. Op mobiel kun je de knoppen gebruiken.</p>
  </main>
  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const messageEl = document.getElementById('message');
    const cell = 20, cells = canvas.width / cell;
    let snake, food, dx, dy, score, timer = null, playing = false;

    function placeFood() {
      do {
        food = { x: Math.floor(Math.random() * cells), y: Math.floor(Math.random() * cells) };
      } while (snake.some(part => part.x === food.x && part.y === food.y));
    }

    function draw() {
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#fb7185';
      ctx.beginPath();
      ctx.arc(food.x * cell + cell / 2, food.y * cell + cell / 2, cell / 2 - 2, 0, Math.PI * 2);
      ctx.fill();
      snake.forEach((part, i) => {
        ctx.fillStyle = i === 0 ? '#bbf7d0' : '#4ade80';
        ctx.fillRect(part.x * cell + 1, part.y * cell + 1, cell - 2, cell - 2);
      });
    }

    function startGame() {
      clearInterval(timer);
      snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
      dx = 1; dy = 0; score = 0; playing = true;
      scoreEl.textContent = score;
      messageEl.textContent = 'Veel plezier!';
      placeFood();
      draw();
      timer = setInterval(update, 115);
    }

    function endGame() {
      clearInterval(timer);
      playing = false;
      messageEl.textContent = 'Game over! Je score is ' + score + '. Druk op Start om opnieuw te spelen.';
    }

    function setDirection(x, y) {
      if (!playing || (x === -dx && y === -dy)) return;
      dx = x; dy = y;
    }

    function update() {
      const head = { x: snake[0].x + dx, y: snake[0].y + dy };
      const eating = head.x === food.x && head.y === food.y;
      const bodyToCheck = eating ? snake : snake.slice(0, -1);
      if (head.x < 0 || head.x >= cells || head.y < 0 || head.y >= cells ||
          bodyToCheck.some(part => part.x === head.x && part.y === head.y)) {
        endGame(); return;
      }
      snake.unshift(head);
      if (eating) {
        score++;
        scoreEl.textContent = score;
        placeFood();
      } else {
        snake.pop();
      }
      draw();
    }

    document.addEventListener('keydown', event => {
      const directions = {
        ArrowUp: [0, -1], w: [0, -1], W: [0, -1],
        ArrowDown: [0, 1], s: [0, 1], S: [0, 1],
        ArrowLeft: [-1, 0], a: [-1, 0], A: [-1, 0],
        ArrowRight: [1, 0], d: [1, 0], D: [1, 0]
      };
      if (directions[event.key]) {
        event.preventDefault();
        setDirection(...directions[event.key]);
      }
    });
    document.getElementById('start').addEventListener('click', startGame);
    document.querySelectorAll('[data-dir]').forEach(button => {
      button.addEventListener('click', () => {
        const dirs = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
        setDirection(...dirs[button.dataset.dir]);
      });
    });
    draw();
  </script>
</body>
</html>
